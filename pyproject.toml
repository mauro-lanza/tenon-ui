[project]
name = "tenon-ui"
version = "0.1.0"
description = "Tray/menu-bar app for the tenon provisioning tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["PySide6-Essentials~=6.8.3"]

[project.scripts]
tenon-ui = "tenon_ui.app:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenon_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
